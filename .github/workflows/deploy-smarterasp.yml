name: Deploy to SmarterASP.NET

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-test-and-deploy:
    name: Build, Test & Deploy to SmarterASP.NET
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore BiseSukkur.slnx

    - name: Run Test Suite
      run: dotnet test BiseSukkur.slnx --configuration Release --no-restore --verbosity normal

    - name: Check Deployment Credentials
      id: check_creds
      run: |
        $hasWebDeploy = "${{ secrets.SMARTERASP_PASSWORD }}" -ne ""
        $hasFtp = "${{ secrets.SMARTERASP_FTP_PASSWORD }}" -ne ""
        if (-not $hasWebDeploy -and -not $hasFtp) {
          Write-Host "::warning ::SMARTERASP_PASSWORD secret is not set in GitHub repository settings. Automatic deployment step was skipped. To enable auto-deploy on git push, add SMARTERASP_PASSWORD under GitHub -> Settings -> Secrets and variables -> Actions."
        }

    - name: Deploy to SmarterASP.NET via Web Deploy
      if: ${{ secrets.SMARTERASP_PASSWORD != '' }}
      run: |
        dotnet publish src/BiseSukkur.Web/BiseSukkur.Web.csproj -c Release /p:PublishProfile="indussoftwaretec-001-site1 - Web Deploy" /p:Password="${{ secrets.SMARTERASP_PASSWORD }}" /p:AllowUntrustedCertificate=True

    - name: Fallback Deploy via FTP
      if: ${{ secrets.SMARTERASP_FTP_PASSWORD != '' && secrets.SMARTERASP_PASSWORD == '' }}
      run: |
        dotnet publish src/BiseSukkur.Web/BiseSukkur.Web.csproj -c Release /p:PublishProfile="indussoftwaretec-001-site1 - FTP" /p:Password="${{ secrets.SMARTERASP_FTP_PASSWORD }}"
