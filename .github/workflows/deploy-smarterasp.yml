name: Deploy to SmarterASP.NET

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-test-and-deploy:
    name: Build, Test & Deploy to SmarterASP.NET
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore BiseSukkur.slnx

    - name: Run Test Suite
      run: dotnet test BiseSukkur.slnx --configuration Release --no-restore --verbosity normal

    - name: Publish Web Application (Release)
      run: |
        dotnet publish src/BiseSukkur.Web/BiseSukkur.Web.csproj -c Release -o ./publish --no-self-contained
        if (-not (Test-Path ./publish/logs)) { New-Item -ItemType Directory -Path ./publish/logs -Force }

    - name: Deploy via FTPS to SmarterASP.NET
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      if: env.HAS_SECRETS == 'true'
      env:
        HAS_SECRETS: ${{ secrets.SMARTERASP_FTP_SERVER != '' && secrets.SMARTERASP_FTP_USERNAME != '' }}
      with:
        server: ${{ secrets.SMARTERASP_FTP_SERVER }}
        username: ${{ secrets.SMARTERASP_FTP_USERNAME }}
        password: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
        server-dir: ${{ secrets.SMARTERASP_FTP_PATH || '/' }}
        local-dir: ./publish/
        protocol: ftps
        security: loose
