# Docker Compose Production Override
# Use for local production-mode testing: docker compose -f docker-compose.yml -f docker-compose.production.yml up
# In AWS, the app runs on ECS Fargate with RDS — this file removes the SQL Server container.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bisehyderabad_web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - SeedPassword=${SEED_PASSWORD:-}
    restart: unless-stopped
    # No depends_on sqlserver — production uses Amazon RDS

  # sqlserver service is intentionally omitted for production
